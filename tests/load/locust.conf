# Locust configuration for the Diomede load tests.
# Usage:
#   locust --config tests/load/locust.conf RoutingUser        # routing-latency KPI
#   LOAD_BURST_COUNT=100 locust --config tests/load/locust.conf IngestUser   # 100-image burst

locustfile = tests/load/locustfile.py
headless = true
users = 100
spawn-rate = 5
run-time = 10m

# Save an HTML report after each run
html = tests/load/report.html

# Save a CSV report after each run
csv = tests/load/report.csv
